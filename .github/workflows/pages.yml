# Publishes we-report Studio to GitHub Pages. Set the repository variable DEMO_BACKEND_URL to the
# public demo backend (samples/backends/node with WE_REPORT_DEMO=1) to enable the live-database demo.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:libs
      - run: npx ng build studio --base-href /${{ github.event.repository.name }}/

      - name: Point the studio at the demo backend
        if: ${{ vars.DEMO_BACKEND_URL != '' }}
        run: sed -i 's#<meta name="we-report-backend" content="">#<meta name="we-report-backend" content="${{ vars.DEMO_BACKEND_URL }}">#' dist/studio/browser/index.html

      # Single-page app: unknown paths fall back to the studio.
      - run: cp dist/studio/browser/index.html dist/studio/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/studio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
