name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build libraries
        run: npm run build:libs

      - name: Unit tests
        run: npm test

      - name: Build studio
        run: npm run build:studio

  backend-node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d shop" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: samples/backends/node
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - name: Unit tests
        run: npm test

      - name: Protocol conformance — SQLite
        run: |
          npm start &
          npx --yes wait-on@8 -t 30000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

      - name: Load the sample dataset into PostgreSQL with a read-only user
        env:
          PGPASSWORD: owner
        run: |
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../../data/seed.sql
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f postgres-readonly.sql

      - name: Protocol conformance — PostgreSQL
        env:
          WE_REPORT_CONNECTIONS: '[{"id":"shop","name":"Shop","dialect":"postgres","url":"postgres://report_reader:reader-password-change-me@127.0.0.1:5432/shop","allowFreeSql":true}]'
        run: |
          npm start &
          npx --yes wait-on@8 -t 30000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

  backend-dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d shop" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: samples/backends/dotnet
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: dotnet build -c Release

      - name: Protocol conformance — SQLite
        run: |
          dotnet bin/Release/net10.0/WeReport.Backend.dll &
          npx --yes wait-on@8 -t 60000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

      - name: Load the sample dataset into PostgreSQL with a read-only user
        env:
          PGPASSWORD: owner
        run: |
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../../data/seed.sql
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../node/postgres-readonly.sql

      - name: Protocol conformance — PostgreSQL
        env:
          WE_REPORT_CONNECTIONS: '[{"id":"shop","name":"Shop","dialect":"postgres","url":"Host=127.0.0.1;Database=shop;Username=report_reader;Password=reader-password-change-me","allowFreeSql":true}]'
        run: |
          dotnet bin/Release/net10.0/WeReport.Backend.dll &
          npx --yes wait-on@8 -t 60000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

  backend-spring-boot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d shop" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: samples/backends/spring-boot
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: ./mvnw -q -DskipTests package

      - name: Protocol conformance — SQLite
        run: |
          java -jar target/we-report-backend-0.1.0.jar &
          npx --yes wait-on@8 -t 90000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

      - name: Load the sample dataset into PostgreSQL with a read-only user
        env:
          PGPASSWORD: owner
        run: |
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../../data/seed.sql
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../node/postgres-readonly.sql

      - name: Protocol conformance — PostgreSQL
        env:
          WE_REPORT_CONNECTIONS: '[{"id":"shop","name":"Shop","dialect":"postgres","url":"jdbc:postgresql://127.0.0.1:5432/shop?user=report_reader&password=reader-password-change-me","allowFreeSql":true}]'
        run: |
          java -jar target/we-report-backend-0.1.0.jar &
          npx --yes wait-on@8 -t 90000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

  backend-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d shop" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: samples/backends/python
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: pip install -r requirements.txt "psycopg[binary]>=3.2"

      - name: Protocol conformance — SQLite
        run: |
          python main.py &
          npx --yes wait-on@8 -t 30000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

      - name: Load the sample dataset into PostgreSQL with a read-only user
        env:
          PGPASSWORD: owner
        run: |
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../../data/seed.sql
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../node/postgres-readonly.sql

      - name: Protocol conformance — PostgreSQL
        env:
          WE_REPORT_CONNECTIONS: '[{"id":"shop","name":"Shop","dialect":"postgres","url":"postgresql://report_reader:reader-password-change-me@127.0.0.1:5432/shop","allowFreeSql":true}]'
        run: |
          python main.py &
          npx --yes wait-on@8 -t 30000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

  backend-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d shop" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: samples/backends/go
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: samples/backends/go/go.mod
          cache-dependency-path: samples/backends/go/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: go vet ./... && go build -o we-report-backend .

      - name: Protocol conformance — SQLite
        run: |
          ./we-report-backend &
          npx --yes wait-on@8 -t 30000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

      - name: Load the sample dataset into PostgreSQL with a read-only user
        env:
          PGPASSWORD: owner
        run: |
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../../data/seed.sql
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../node/postgres-readonly.sql

      - name: Protocol conformance — PostgreSQL
        env:
          WE_REPORT_CONNECTIONS: '[{"id":"shop","name":"Shop","dialect":"postgres","url":"postgresql://report_reader:reader-password-change-me@127.0.0.1:5432/shop","allowFreeSql":true}]'
        run: |
          ./we-report-backend &
          npx --yes wait-on@8 -t 30000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

  backend-php:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d shop" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: samples/backends/php
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, curl
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: for f in public/*.php src/*.php; do php -l "$f"; done

      - name: Protocol conformance — SQLite
        run: |
          php -S 127.0.0.1:5480 public/index.php &
          npx --yes wait-on@8 -t 30000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1

      - name: Load the sample dataset into PostgreSQL with a read-only user
        env:
          PGPASSWORD: owner
        run: |
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../../data/seed.sql
          psql -h 127.0.0.1 -U owner -d shop -v ON_ERROR_STOP=1 -f ../node/postgres-readonly.sql

      - name: Protocol conformance — PostgreSQL
        env:
          WE_REPORT_CONNECTIONS: '[{"id":"shop","name":"Shop","dialect":"postgres","url":"postgresql://report_reader:reader-password-change-me@127.0.0.1:5432/shop","allowFreeSql":true}]'
        run: |
          php -S 127.0.0.1:5480 public/index.php &
          npx --yes wait-on@8 -t 30000 http-get://127.0.0.1:5480/v1/info
          node ../../../tools/protocol-conformance/run.mjs http://127.0.0.1:5480
          kill %1
